name: Deploy POWER Engine website

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage and validate website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp ./*.html main.js _site/
          cp -R runtime pages components assets _site/
          test -f _site/index.html
          test -f _site/main.js
          test -f _site/runtime/App.js
          test -f _site/pages/home/index.html
          test -f _site/pages/docs/power-1/index.html
          test -f _site/assets/css/site.css
          test -f _site/components/site-footer.html
          echo "Website structure validated."

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
