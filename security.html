lor:#c6ff5f70}.ico{display:grid;place-items:center;width:42px;height:42px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;font-size:20px}.feature h3{font-size:15px;margin:18px 0 7px}.feature p{font-size:12px;color:var(--muted);margin:0}.quick{display:grid;grid-template-columns:.9fr 1.1fr;gap:45px;align-items:center}.checks{display:grid;gap:12px;margin-top:22px;color:var(--muted);font-size:12px}.checks span:before{content:"✓";color:var(--lime);margin-right:10px}.codebox{border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}.codehead{padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{display:flex;gap:4px}.tab{padding:6px 8px;border-radius:7px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:10px;cursor:pointer}.tab.active{background:var(--panel2);border-color:var(--line);color:var(--ink)}pre{margin:0;padding:20px;overflow:auto;font:11px/2 ui-monospace,monospace;min-height:160px;color:var(--muted)}.codefoot{padding:12px 15px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.download{padding:0 0 80px}.downloadbox{background:var(--lime);color:var(--limeink);border-radius:25px;padding:38px;display:flex;align-items:center;justify-content:space-between;gap:25px}.downloadbox h2{margin:0 0 8px}.downloadbox p{font-size:12px;max-width:500px;margin:0;opacity:.78}.downloadbox .btn{background:#101710;color:#f5ffe9;border-color:#101710;white-space:nowrap}.faqgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.faq{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:19px}.faq h3{font-size:13px;margin:0 0 7px}.faq p{font-size:12px;color:var(--muted);margin:0}footer{border-top:1px solid var(--line);padding:25px 0 34px;color:var(--muted);font-size:10px}.footrow{display:flex;justify-content:space-between;gap:20px}.footlinks{display:flex;g
